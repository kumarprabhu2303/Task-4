<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- CRITICAL: Tells the browser how to control the page's dimensions and scaling -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Book Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Menu -->
    <nav class="navbar">
        <div class="logo">BookHaven</div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Catalog</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <!-- Two-Column Hero Section -->
    <main class="hero-container">
        <div class="hero-text">
            <h1>Discover Your Next Great Adventure</h1>
            <p>Explore thousands of digital and physical books curated just for you. Jump into worlds unknown today.</p>
            <button class="cta-btn">Browse Now</button>
        </div>
        <div class="hero-image">
            <!-- Example placeholder image that needs to scale dynamically -->
             <img src="book.jpg" alt="Opened book illustration">
        </div>
    </main>

</body>
</html>
